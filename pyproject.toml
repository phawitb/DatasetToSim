[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-to-sim"
version = "0.1.0"
description = "Traceable MuJoCo replay and calibration for a real SO-101 LeRobot dataset"
requires-python = ">=3.11"
dependencies = ["mujoco==3.17.0", "numpy>=2.0", "pyarrow>=18", "opencv-python>=4.10", "scipy>=1.14"]

[project.optional-dependencies]
studio = ["fastapi>=0.115", "uvicorn>=0.32", "ruckig==0.17.3"]

[project.scripts]
dataset-to-sim = "dataset_to_sim.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
